<!DOCTYPE html><html lang="en"><head><title></title></head>
<style>canvas{ display:block; } body, html { padding:0px; margin:0px; width:100%; height:100%; }</style>
<body><script src="../../../import-map.js"></script><script type="module">
// #region IMPORTS
import useThreeWebGL2, { THREE, useDarkScene, useVisualDebug } from '@lib/useThreeWebGL2.js';

import FixedFrame       from '@lib/misc/FixedFrame.js';
import KeyboardInput    from '@lib/input/KeyboardInput.js';
import GamepadInput     from '@lib/input/GamepadInput.js';
import Cursor3DMaterial from '@lib/shader/Cursor3DMaterial.js';

import Vec3             from '@lib/maths/Vec3.js';
import Quat             from '@lib/maths/Quat.js';
import Radian           from '@lib/maths/Radian.js';
import FImplicitEuler   from '@lib/maths/springs/FImplicitEuler.js';
// #endregion

// #region MAIN
let App   = useDarkScene( useThreeWebGL2() );
let Debug = {};
let Ref   = {
    ki : new KeyboardInput(),
    gi : new GamepadInput(),
};

/*
    UPDATE  : Input State < Keyboard
    UPDATE  : Test/Run Fixed Update
    FIXED   : Input State < Camera
              - XZ Cam Fwd / Rit, Joy Wgt, Joy XZ Look Dir
    FIXED   : Baller.onFixed
              - Char State Update
    UPDATE  : Baller.onFrame, Apply Lerped Transform Data
*/

window.addEventListener( 'load', async ()=>{
	// ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
	App.sphericalLook( 45, 20, 14 );
    Debug        = await useVisualDebug( App );
    Ref.inpState = new InputState();
    Ref.fixed    = new FixedFrame( 15, onFixedFrame );

    // ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
    Ref.baller = new Baller();
    App.scene.add( Ref.baller.grp );

    // ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
    App.createRenderLoop( onPreRender ).start();
    // App.renderLoop();
    appendGithubLink( false );
});

function onPreRender( dt, et, ts ){
    // Debug.reset();

    // ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
    // INPUTS
    keyboardHandler( Ref.ki, Ref.inpState );
    gamepadHandler( Ref.gi, Ref.inpState );

    // ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
    // Execute Fixed Frame Updates
    Ref.fixed.update( ts );

    // Apply in between fixed frame transforms
    Ref.baller.onFrame( dt, Ref.fixed.tStep );
}

function onFixedFrame( dt, ts ){
    // Debug.reset();

    // Update directions based on camera
    Ref.inpState.updateFromCamera( App.camera );

    // Compute the next transform state for the baller
    Ref.baller.onFixedFrame( dt, ts, Ref.inpState );
}

function keyboardHandler( ki, state ){
    // ~~~~~~~~~~~~~~~~~~~~~~~~~~
    // Movement
    const info  = ki.getWASD();
    state.xAxis = info.x;
    state.yAxis = info.y;

    // ~~~~~~~~~~~~~~~~~~~~~~~~~~
    // Actions
    state.setAction( 'run', ki.isDown( 'shift' ) );
}

// Ref.gi.onControlReady = profile =>{ console.log( 'GAMEPAD Profile', profile ); };
function gamepadHandler( gi, state ){
    const pad = ( gi.count )? gi.poll().getPad() : null;
    if( !pad ) return;

    // ~~~~~~~~~~~~~~~~~~~~~~~~~~
    // Movement
    const axes = pad.getAxesValue( 'joyStickR' );
    state.xAxis = axes[0];
    state.yAxis = -axes[1];

    // ~~~~~~~~~~~~~~~~~~~~~~~~~~
    // Actions
    state.setAction( 'run', pad.isButtonDown( 'a' ) );
}
// #endregion

class SphereMaterial extends THREE.RawShaderMaterial{
    constructor( props={} ){
        super();

        // ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
        // Merge custom props with default options
        // const opts = Object.assign({
        //     offset : [ 0, 1, 0 ],
        //     color  : new THREE.Color( '#00ff00' ),
        // }, props );

        // ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
        this.name               = 'SphereMaterial';
        this.glslVersion        = THREE.GLSL3;
        // this.side               = THREE.DoubleSide;
        // this.depthTest          = true;
        // this.transparent        = true;
        // this.alphaToCoverage    = true;
        // this.lights             = true;

        this.uniforms           = {
            // oRadius     : { value: 0.49 },
            // color       : { value: new THREE.Color( '#202020' ) },
            // tex         : { type: 'sampler2D', value: props.tex },
        };

        // ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
        this.vertexShader = `
        in vec3 position;
        in vec3 normal;
        in vec2 uv;

        // uniform highp vec3 cameraPosition;

        uniform mat4 modelMatrix;
        uniform mat4 viewMatrix;
        uniform mat4 projectionMatrix;

        out vec3 fragLPos;
        out vec3 fragWPos;
        out vec3 fragNorm;
        out vec2 fragUV;

        // #####################################################################

        void main(){
            vec4 wPos 	= modelMatrix * vec4( position, 1.0 );  // World Space
            vec4 vPos   = viewMatrix * wPos;                    // View Space

            fragUV      = uv;
            fragWPos    = wPos.xyz;
            fragLPos    = position.xyz;
            fragNorm    = ( modelMatrix * vec4( normal, 0.0 ) ).xyz;

            gl_Position = projectionMatrix * vPos;
        }`;

        this.fragmentShader = `precision mediump float;
        uniform vec3 cameraPosition;

        in  vec3    fragWPos;
        in  vec3    fragLPos;
        in  vec3    fragNorm;
        in  vec2    fragUV;

        out vec4    outColor;

        // #####################################################################

        const int LITE_CNT = 1;

        // #####################################################################

        void main(){
            vec3 color = vec3( 0.8 );
            outColor   = vec4( color, 1.0 );

            // ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
            // Lighting
            vec3 LP   = vec3( 3.0, 3.0, 3.0 );      // Light Position
            vec3 L    = normalize( LP - fragWPos ); // Light Direction
            vec3 N    = normalize( fragNorm );      // Sphere point direction

            // float NdL = max( dot( N, L ), 0.0 );    // Lambertian

            float NdL = dot( N, L ) * 0.5 + 0.5;    // Half Lambert
            // NdL = NdL * NdL;                        // Curve the value a bit for better shadows

            // outColor = vec4( vec3( NdL ), 1.0 );

            // ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
            float mask      = smoothstep( 0.08, 0.09, abs( fragLPos.z ) );
            vec3  yColor    = ( fragLPos.y >= 0.0 )? vec3( 1.0, 0.0, 0.0 ) : vec3( 0.0, 1.0, 0.0 );

            // outColor.rgb    = vec3( mask );
            // outColor.rgb = color * mask * NdL;

            outColor.rgb = mix( yColor, color * NdL, mask );
        }`;
    }

    // #region SETTERS
    // setOffset( v ){
    //     this.uniforms.offset.value = v;
    //     return this;
    // }
    // #endregion
}

// cLength = PI * ( 2 * Radius )                     // Complete distance around the circle
// rad = TAU * ( Distance / cLength )                // Speed/Movement to sphere arc rotation
// ArcLength = ( Rad / TAO ) * ( 2 * PI * RADIUS )   // Length of a specific arc
class Baller{
    // #region MAIN
    grp         = new THREE.Group();    // Main Container ( XZ Rotation & Translationbg=)
    cstate      = new CharState();      // Character State Object

    mesh        = null;                 // Ball Mesh
    radius      = 1;
    arcLen      = Math.PI * this.radius * 2; // C = Pi * 2R;

    constructor(){
        this.cstate.arcLen = this.arcLen;

        // ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
        this.mesh = new THREE.Mesh(
            new THREE.SphereGeometry( 1, 32, 16 ),
            new SphereMaterial()
        );
        this.mesh.position.y = 1.0;;

        // ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
        this.grp.add(
            this.mesh,
            Cursor3DMaterial.createMesh( { scale:1.5, factor:0.0, color:'#d0d0d0' } ),
        );
    }
    // #endregion

    // #region UPDATES
    onFixedFrame( dt, ts, iState ){
        // Compute transform for the next fixed frame
        this.cstate.onFixedFrame( dt, ts, iState );
    }

    onFrame( dt, tStep ){
        this.cstate.onFrame( dt, tStep );                       // Compute current position
        this.grp.position.fromArray( this.cstate.posCur );      // Translation
        this.grp.quaternion.fromArray( this.cstate.rotCur );    // XZ rotation
        this.mesh.quaternion.fromArray( this.cstate.spnCur );   // Ball X Spin
    }
    // #endregion
}


class CharState{
    // #region MAIN

    // Motion / Rotation
    arcLen    = 1;                  // Arc length of the sphere
    walkSpeed = 4;                  // Max Walking Speed
    runSpeed  = this.walkSpeed * 3; // Max Running Speed
    vel       = new FImplicitEuler( { osc:0.8 } );  // Velocity controlled by spring
    angle     = new FImplicitEuler( { osc:2 } );    // XY rotation angel controlled by spring

    // Fixed Lerp
    rotPrev = new Quat();   // XZ Rotation
    rotNext = new Quat();
    rotCur  = new Quat();

    posPrev = new Vec3();   // Translation
    posNext = new Vec3();
    posCur  = new Vec3();

    spnRad  = 0;            // Rotation spin in sync with translation
    spnPrev = new Quat();
    spnNext = new Quat();
    spnCur  = new Quat();
    // #endregion

    // #region UPDATES
    onFixedFrame( dt, ts, iState ){
        // ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
        // LOOK ROTATION

        // Update look direction if joystick is being used
        if( iState.joyWgt !== 0 ){
            // 180deg angle from world fwd & its sign
            let rad = Vec3.angle( [0,0,1], iState.viewJoy );
            if( Vec3.dot( [1,0,0], iState.viewJoy ) < 0 ) rad = -rad;

            // Fix angle to ignore 180deg boundary for smooth shortest path rotation
            this.angle.target = Radian.continuousTarget( this.angle.value, rad );
        }

        this.angle.update( dt );
        this.rotPrev.copy( this.rotNext );
        this.rotNext.fromAxisAngle( [0,1,0], this.angle.value );

        // ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
        // TRANSLATION
        this.vel.target = iState.isOn( 'run' )
            ? this.runSpeed  * iState.joyWgt
            : this.walkSpeed * iState.joyWgt;

        this.vel.update( dt );
        const delta = this.vel.value * dt;

        this.posPrev.copy( this.posNext );
        this.posNext
            .fromQuat( this.rotNext, [0,0,1] )
            .scale( delta )
            .add( this.posPrev );

        // ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
        // SPIN ROTATION
        const rad  = ( Math.PI * 2 ) * ( delta / this.arcLen ); // Speed to sphere arc rotation
        const spin = Radian.wrapTAU( this.spnRad + rad );

        this.spnRad = spin;
        this.spnPrev.copy( this.spnNext );
        this.spnNext.fromAxisAngle( [1,0,0], spin );
    }

    onFrame( dt, tStep ){
        this.rotCur.fromSlerp( this.rotPrev, this.rotNext, tStep );
        this.posCur.fromLerp( this.posPrev, this.posNext, tStep );
        this.spnCur.fromSlerp( this.spnPrev, this.spnNext, tStep );
    }
    // #endregion
}


class InputState{
    static END = -1;
    static OFF  = 0;
    static INIT = 1;
    static HOLD = 2;

    // CAMERA
    viewFwd  = new Vec3();  // Camera view firward direction on XZ plane
    viewRit  = new Vec3();  // Camera view right direction on XZ plane
    viewJoy  = new Vec3();  // Joysticks current direction in relation to camera view

    // MOVEMENT
    xAxis    = 0; // Values between -1 : 1
    yAxis    = 0;
    joyWgt   = 0;

    // ACTIONS
    run      = 0;

    setAction( key, v ){
        if( !v ) this[key] = this[key] > 0  ? InputState.END  : InputState.OFF;
        else     this[key] = this[key] <= 0 ? InputState.INIT : InputState.HOLD;
    }

    isOn( key ){ return ( this[key] > 0 ); }
    isOff( key ){ return ( this[key] <= 0 ); }

    updateFromCamera( cam ){
        // ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
        // Compute XZ plane direction from camera view
        const q = new Quat().copyObj( cam.quaternion );
        this.viewFwd.fromQuat( q, [0,0,1] ).negate().sy(0).norm();
        this.viewRit.fromCross( this.viewFwd, [0,1,0] ).norm();

        // Debug.ln.addDir( null, this.viewFwd, 2, 0x00ff00 );
        // Debug.ln.addDir( null, this.viewRit, 2, 0xff0000 );

        // ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
        // Compute the look direction from input
        this.viewJoy.zero()
            .scaleThenAdd( this.yAxis, this.viewFwd )
            .scaleThenAdd( this.xAxis, this.viewRit );

        // For joysticks, what is the overall thottle or speed
        this.joyWgt = Math.max( 0, Math.min( 1, this.viewJoy.len ) );
        this.viewJoy.norm();

        // Debug.ln.addDir( null, this.viewJoy, 5, 0xff00ff );
    }
}

</script></body></html>
