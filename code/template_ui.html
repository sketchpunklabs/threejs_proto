<!---->
<group-panel label="Controls" float style="position:fixed; left:calc(100vw - 310px); top:10px; width:300px;">
    <section class="grpItem">
        <toggle-btn label="on" labeloff="off"></toggle-btn>

        <toggle-btn-bar valuex="week">
            <button data-value="day">A</button>
            <button data-value="week">off</button>
            <button data-value="month">Month1234567</button>
            <button data-value="year">Year</button>
        </toggle-btn-bar>

        <vec3-input value="[1,2,3]" label='["R:","G:","B:"]' step="0.1"></vec3-input>

        <input type="number" class="txtInp" value="0">

        <textarea class="txtArea">Testing One</textarea>

        <drop-down msg="pick item" value="">
            <option value="test">default</option>
            <option value="yo">Yo</option>
            <option value="x">Three</option>
            <option value="y">Four</option>
        </drop-down>

        <label>Stuff</label>
        <detail class="tblText">
            <span>A</span><div><input type="number" class="txtInp" value="0"></div>
            <span>BBB</span><div><input type="number" class="txtInp" value="0"></div>
        </detail>

        <div class="flexRow">
            <ring-input id="inpRingx" mode="joy" auto-center></ring-input>
            <ring-input id="inpRing" mode="dir" auto-center></ring-input>
        </div>


    </section>
</group-panel>


<div class="scrollPanel" style="position:fixed; left:calc(100vw * 0.5 - 310px); top:10px; width:300px; max-height:200px;">

    <group-panel label="Controls Stack">
        <section class="grpItem">
            <toggle-btn label="on" labeloff="off"></toggle-btn>

            <toggle-btn-bar valuex="week">
                <button data-value="day">A</button>
                <button data-value="week">off</button>
                <button data-value="month">Month1234567</button>
                <button data-value="year">Year</button>
            </toggle-btn-bar>

            <vec3-input value="[1,2,3]" label='["R:","G:","B:"]' step="0.1"></vec3-input>

            <input type="number" class="txtInp" value="0">
        </section>
    </group-panel>

    <group-panel label="Info">
        <section class="grpItem">
            <detail class="tblText">
                <span>Move</span><div>WASD</div>
                <span>Attack</span><div>Up Arrow</div>
            </detail>

            <label>Info</label>
            <div class="txtPanel">
                Right click to select 3D Object
            </div>
        </section>
    </group-panel>

</div>
